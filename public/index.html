<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="description" content="현장 데이터 운영과 청년 현장 AI 직무 증거를 연결하는 NAEIL 시연 서비스">
    <meta name="theme-color" content="#ffffff">
    <title>NAEIL · 현장의 AI와 청년의 내일을 잇다</title>
    <link rel="icon" href="./assets/naeil-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./app.css">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">
          <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
        </button>
        <a class="brand" href="#home" aria-label="NAEIL 홈">
          <img src="./assets/naeil-mark.svg" alt="">
          <span><strong>NAEIL</strong><small>현장 AI와 청년 일자리 연결</small></span>
        </a>
        <p class="topbar-tagline">현장의 AI와 청년의 내일을 잇다</p>
        <div class="topbar-controls">
          <label class="select-control"><span>현장</span><select id="field-select" aria-label="현장 전환"><option value="manufacturing">제조 현장</option><option value="smallBusiness">소상공인 현장</option></select></label>
          <label class="select-control"><span>역할</span><select id="role-select" aria-label="역할 선택"></select></label>
        </div>
      </header>

      <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
        <div class="sidebar-context">
          <p class="eyebrow">현재 화면</p>
          <strong id="context-title">제조 현장</strong>
          <span id="context-role">운영 코디네이터</span>
        </div>
        <nav id="primary-nav" aria-label="역할별 탐색"></nav>
        <section class="boundary-card" aria-labelledby="boundary-title">
          <p class="eyebrow">데모 안내</p>
          <h2 id="boundary-title">브라우저 모의 운영</h2>
          <p>역할 선택은 화면 필터입니다. 인증·서버 권한·영구 저장·실제 지급은 연결되지 않았습니다.</p>
          <button class="text-button" id="reset-state" type="button">로컬 데모 기록 초기화</button>
        </section>
      </aside>
      <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="메뉴 닫기" hidden></button>

      <main id="main" tabindex="-1">
        <div id="view" aria-live="polite"></div>
      </main>
    </div>
    <dialog class="boundary-dialog" id="simulation-boundary-dialog" aria-labelledby="simulation-boundary-title">
      <form method="dialog">
        <p class="eyebrow" id="simulation-boundary-code">시뮬레이션 안내</p>
        <h2 id="simulation-boundary-title">실행 전 확인</h2>
        <div class="notice warning" id="simulation-boundary-source">AI 생성 합성 예시</div>
        <section class="boundary-detail" aria-labelledby="simulation-boundary-reason-title">
          <h3 id="simulation-boundary-reason-title">현재 실행하지 않는 이유</h3>
          <p id="simulation-boundary-reason"></p>
        </section>
        <section class="boundary-detail" aria-labelledby="simulation-boundary-requirement-title">
          <h3 id="simulation-boundary-requirement-title">실제 연결에 필요한 조건</h3>
          <p id="simulation-boundary-requirement"></p>
        </section>
        <p class="boundary-safety">이 확인창은 제품 상태를 변경하지 않으며 외부 장비·학습·채용·계약·데이터 시스템을 호출하지 않습니다.</p>
        <button class="button primary" type="submit">확인하고 돌아가기</button>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
